<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEN Paper Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: header and view tabs; a paper view is a reading-order navigator (chart + slider) above three layer columns
     joined by wires that change state with the unit, beside a sticky rail that shows the events of the current unit */
  --paper:#f5f6f8; --panel:#ffffff; --ink:#18202b; --muted:#5b6777; --line:#d8dde5; --accent:#0f5c7a; --accent-soft:#e2eff4;
  --c-stated:#a86400; --c-supported:#1c7a52; --c-cond:#7646ad; --c-node:#2a5db0; --c-bad:#bf2630;
  --band-a:#eceff3; --band-b:#f7f8fa;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Cambria Math","STIX Two Math","Noto Sans Math","Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Cambria Math","Noto Sans Math",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10151c; --panel:#171f29; --ink:#e5eaf1; --muted:#99a6b5; --line:#2b3644; --accent:#6cc3de; --accent-soft:#16313c;
    --c-stated:#e0a54a; --c-supported:#5fce9e; --c-cond:#b996e8; --c-node:#82b2f6; --c-bad:#f2737a;
    --band-a:#1b2430; --band-b:#141b24;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10151c; --panel:#171f29; --ink:#e5eaf1; --muted:#99a6b5; --line:#2b3644; --accent:#6cc3de; --accent-soft:#16313c;
  --c-stated:#e0a54a; --c-supported:#5fce9e; --c-cond:#b996e8; --c-node:#82b2f6; --c-bad:#f2737a;
  --band-a:#1b2430; --band-b:#141b24;
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.5}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px 56px}
header.top{padding:22px 0 10px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
header.top h1{font-family:var(--font-display);font-weight:600;font-size:1.75rem;line-height:1.15;margin:0;text-wrap:balance}
header.top .meta{color:var(--muted);font-size:.87rem;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
nav.tabs a{padding:8px 13px;text-decoration:none;color:var(--muted);border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;font-weight:500;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--panel);border-color:var(--line)}
nav.tabs a:hover{color:var(--ink)}
h2{font-family:var(--font-display);font-weight:600;font-size:1.25rem;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:1.02rem;margin:0 0 6px;letter-spacing:.01em;text-wrap:balance}
p{margin:0 0 10px}
.lede{max-width:68ch;font-size:1.02rem}
.prose{max-width:72ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:.86em}
.small{font-size:.87rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.82rem;letter-spacing:.01em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll-x{overflow-x:auto}
tr.div td{border-bottom:2px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:500;border:1px solid currentColor;white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.k-stated{color:var(--c-stated)} .k-supported{color:var(--c-supported)} .k-cond{color:var(--c-cond)} .k-node{color:var(--c-node)} .k-bad{color:var(--c-bad)} .k-muted{color:var(--muted)}
.op{font-family:var(--font-mono);font-size:.78rem;font-weight:500;color:var(--accent);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px 13px}
.stat b{display:block;font-family:var(--font-display);font-size:1.5rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem;display:block;line-height:1.35}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.cols22{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.cols22{grid-template-columns:minmax(0,1fr)}}
.gen-badge{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;color:var(--muted)}
.gen-note{border-left:4px solid var(--muted)}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin-bottom:6px;max-width:75ch}
/* navigator */
.nav{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.nav button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;min-height:34px}
.nav button:hover{border-color:var(--accent);background:var(--accent-soft)}
.nav button:disabled{opacity:.4;cursor:default}
.nav input[type=range]{flex:1 1 220px;min-width:160px;accent-color:var(--accent)}
.nav .where{font-weight:600;font-variant-numeric:tabular-nums}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
svg.chart .band-a{fill:var(--band-a)} svg.chart .band-b{fill:var(--band-b)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .l-node{fill:none;stroke:var(--c-node);stroke-width:1.6}
svg.chart .l-stated{fill:none;stroke:var(--c-stated);stroke-width:1.6;stroke-dasharray:5 3}
svg.chart .l-supported{fill:none;stroke:var(--c-supported);stroke-width:2}
svg.chart .a-open{fill:var(--c-stated);opacity:.16}
svg.chart .b-cond{fill:var(--c-cond);opacity:.75}
svg.chart .cursor{fill:var(--accent);opacity:.14}
svg.chart .hit{fill:transparent;cursor:pointer}
svg.chart .hit:hover{fill:var(--accent);opacity:.08}
svg.chart .end{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);align-items:center;margin-top:6px}
.legend i{display:inline-block;width:20px;height:0;border-top:2px solid currentColor;margin-right:5px;vertical-align:3px}
.legend i.dash{border-top-style:dashed}
.legend i.box{height:9px;border:none;background:currentColor;opacity:.75;vertical-align:-1px;width:9px}
/* paper view */
.paper-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
@media (max-width:1100px){.paper-grid{grid-template-columns:minmax(0,1fr)}}
.rail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:1100px){.rail{position:static;max-height:none}}
.cite{font-weight:500;max-width:80ch}
.graph{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 96px;padding:4px 8px 8px}
@media (max-width:760px){.graph{gap:0 44px}}
.col{display:flex;flex-direction:column;gap:9px;position:relative;z-index:2}
.col h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--font-body);font-weight:600;margin-bottom:2px}
.node{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--panel);border-radius:5px;padding:6px 8px;cursor:pointer;min-height:44px}
.node .nid{font-family:var(--font-mono);font-size:.76rem;color:var(--muted);display:block}
.node .nt{display:block;font-size:.84rem;line-height:1.3;font-weight:500;overflow-wrap:anywhere}
.node .ns{display:block;font-size:.72rem;color:var(--muted);margin-top:1px}
.node.st-new,.node.st-out-of-scope{border-left-color:var(--accent)}
.node.st-split{border-left-color:var(--accent);border-left-style:dashed}
.node.st-out-of-scope{border-style:dashed}
.node.ghost{opacity:.55;border-style:dashed;border-left-style:dashed;background:transparent;pointer-events:none;cursor:default}
.node.ghost span{visibility:hidden}
.node.now{outline:2px solid var(--c-node);outline-offset:1px}
.node:hover,.node.sel{border-color:var(--accent);background:var(--accent-soft)}
svg.wires{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
svg.wires path.leg{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.45;pointer-events:stroke;cursor:pointer}
svg.wires path.leg.stated{stroke-dasharray:5 4}
svg.wires path.leg.cond{stroke-dasharray:9 3 2 3}
svg.wires path.leg.now{opacity:1;stroke-width:2.6}
svg.wires path.leg.hl{opacity:1;stroke-width:2.6}
svg.wires path.leg.lo{opacity:.08}
svg.wires .mk{fill:currentColor}
/* rail */
.rail h2{font-size:1.1rem}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;font-size:.87rem;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.stmt{border-left:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft);border-radius:0 5px 5px 0;margin:8px 0;font-size:.92rem;overflow-wrap:anywhere}
.ev{list-style:none;margin:4px 0 12px;padding:0;font-size:.86rem;display:flex;flex-direction:column;gap:7px}
.ev li{border-left:3px solid var(--line);padding:1px 0 1px 9px}
.ev li.e-node{border-left-color:var(--c-node)} .ev li.e-stated{border-left-color:var(--c-stated)}
.ev li.e-supported{border-left-color:var(--c-supported)} .ev li.e-cond{border-left-color:var(--c-cond)} .ev li.e-added{border-left-style:dashed}
.ev .line1{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ev .line2{color:var(--muted);font-size:.82rem}
.grp{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin:10px 0 2px}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font-family:var(--font-mono);font-size:.84rem;text-decoration:underline}
tr.unit{cursor:pointer}
tr.unit:hover td,tr.unit.cur td{background:var(--accent-soft)}
tr.unit td:first-child{font-variant-numeric:tabular-nums;color:var(--muted)}
tr.unit.off td{color:var(--muted)}
.err{color:var(--c-bad);padding:20px}
@media (prefers-reduced-motion:no-preference){.node{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><h1>GEN Paper Replay</h1><span class="meta" id="runmeta"></span></header>

</div>
<script>

 return el("div",{class:"scroll-x"},[el("table",null,[el("thead",null,[th]),tb])]);}

function start(d){DATA=d;

 var nav=document.getElementById("tabs");VIEWS.forEach(function(v){nav.appendChild(el("a",{href:"#"+v[0],text:v[1],"data-v":v[0]}));});

/* ---------------- chart of one paper: nodes, routes stated, routes supported per unit ---------------- */
function chart(p,cur,onPick,W,H){W=W||640;H=H||170;var U=p.units,n=U.length,L=30,R=64,T=16,B=30,w=(W-L-R)/n;

   var lab=BLOCK[U[i0].block];if(X(i)-X(i0)>lab.length*5.6)svg.appendChild(sv("text",{x:(X(i0)+X(i))/2,y:H-6,"text-anchor":"middle",text:lab}));i0=i;}}
 [0,ymax/2,ymax].forEach(function(v){svg.appendChild(sv("line",{class:"grid",x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));svg.appendChild(sv("text",{x:L-5,y:Y(v)+4,"text-anchor":"end",text:String(v)}));});

 var area="M"+X(0)+" "+Y(U[0].counts.stated);U.forEach(function(u,i){area+=" L"+X(i)+" "+Y(u.counts.stated)+" L"+X(i+1)+" "+Y(u.counts.stated);});

 U.forEach(function(u,i){if(u.counts.conditional)svg.appendChild(sv("rect",{class:"b-cond",x:X(i)+w*0.2,width:w*0.6,y:Y(u.counts.conditional),height:Y(0)-Y(u.counts.conditional)}));});
 svg.appendChild(sv("path",{class:"l-node",d:steps("V")}));svg.appendChild(sv("path",{class:"l-stated",d:steps("stated")}));svg.appendChild(sv("path",{class:"l-supported",d:steps("supported")}));
 var last=U[n-1].counts,ends=[["V",last.V,"k-node","nodes"],["supported",last.supported,"k-supported","routes"]].sort(function(a,b){return b[1]-a[1];});

function chartLegend(){return el("div",{class:"legend"},[el("span",{class:"k-node"},[el("i"),"nodes present"]),el("span",{class:"k-stated"},[el("i",{class:"dash"}),"routes stated"]),el("span",{class:"k-supported"},[el("i"),"routes supported"]),el("span",{class:"k-stated"},[el("i",{class:"box"}),"stated, support still to come"]),el("span",{class:"k-cond"},[el("i",{class:"box"}),"supported on a route supported later"])]);}

/* ---------------- update rule: the answer and the tests ---------------- */
function renderRule(root){var P=DATA.papers,keys=["battery","realqm","top","decay"],B=DATA.branches;
 var wrap=el("div",{class:"stack"});root.appendChild(wrap);
 wrap.appendChild(el("section",null,[el("h2",{text:"What a paper does to the graph, unit by unit"}),
  el("p",{class:"lede",text:"Each of the four encoded papers (three published papers and one generated work) is read from its abstract to its last appendix. A node enters at the unit that first names it. A route has two dates: the unit that states it and the unit that supplies its proof, reference, data or executed certificate. The two published theory papers state more than half of their routes before supporting them, mostly in the main text with the support in the Methods or the appendices, and they draw conclusions before the routes those conclusions use are supported. The experimental paper supports 10 of its 14 routes in the unit that states them, and 6 of the 14 rest on a reference. The generated paper states "+P.decay.order_tests.deferred.length+" of its "+P.decay.coverage.routes+" routes before supporting them: its abstract and introduction state every theorem, and the proofs follow in the body and the appendices. For two routes (the spin-1 kernel and the raw coefficients of a pair) the only support the text points to is the catalogue of certificates in its last appendix, so every theorem that uses them waits until the last unit."})]));
 var cards=el("div",{class:"cols22"});wrap.appendChild(cards);
 keys.forEach(function(k){var p=P[k],ot=p.order_tests,c=p.coverage;
  cards.appendChild(el("section",{class:"panel"},[el("h3",null,[el("a",{href:"#"+HASH[k],text:SHORT[k]}),GENERATED[k]?el("span",{class:"gen-badge",text:"generated work"}):null]),el("p",{class:"small muted",text:c.units+" units · "+c.nodes+" nodes, "+c.nodes_carried+" carried in · "+c.routes+" routes · "+p.text_version}),
   chart(p,null,null,430,160),
   el("div",{class:"stats",style:"margin-top:10px"},[tile(ot.deferred.length+" of "+c.routes,"routes stated before they are supported"),tile(Object.keys(ot.conditional).length,"routes supported on a route that is supported later"),
    tile(ot.forward_links_nodes_supported.length+" / "+ot.forward_links_nodes_stated.length,"routes that precede one of their nodes: by support date / by statement date"),tile(ot.unsupported_in_paper.length,"routes with no proof and no reference in the paper")])]));});
