<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEN Edge-Kernel Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: header and view tabs; a paper view is one main column (claims, three layer columns joined by wires,
     route table, findings) beside a sticky detail rail that shows the selected node, route or claim */
  --paper:#f5f6f8; --panel:#ffffff; --ink:#18202b; --muted:#5b6777; --line:#d8dde5; --accent:#0f5c7a; --accent-soft:#e2eff4;
  --g-exact:#1c7a52; --g-logic:#2a5db0; --g-import:#a86400; --g-compose:#7646ad; --g-def:#69737f; --g-interp:#a13a62; --g-fail:#bf2630; --g-num:#0f7480;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Cambria Math","STIX Two Math","Noto Sans Math","Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Cambria Math","Noto Sans Math",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10151c; --panel:#171f29; --ink:#e5eaf1; --muted:#99a6b5; --line:#2b3644; --accent:#6cc3de; --accent-soft:#16313c;
    --g-exact:#5fce9e; --g-logic:#82b2f6; --g-import:#e0a54a; --g-compose:#b996e8; --g-def:#9aa5b3; --g-interp:#e38bad; --g-fail:#f2737a; --g-num:#5cc4cf;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10151c; --panel:#171f29; --ink:#e5eaf1; --muted:#99a6b5; --line:#2b3644; --accent:#6cc3de; --accent-soft:#16313c;
  --g-exact:#5fce9e; --g-logic:#82b2f6; --g-import:#e0a54a; --g-compose:#b996e8; --g-def:#9aa5b3; --g-interp:#e38bad; --g-fail:#f2737a; --g-num:#5cc4cf;
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.5}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px 56px}
header.top{padding:22px 0 10px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
header.top h1{font-family:var(--font-display);font-weight:600;font-size:1.75rem;line-height:1.15;margin:0;text-wrap:balance}
header.top .meta{color:var(--muted);font-size:.87rem;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;padding-bottom:0}
nav.tabs a{padding:8px 13px;text-decoration:none;color:var(--muted);border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;font-weight:500;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--panel);border-color:var(--line)}
nav.tabs a:hover{color:var(--ink)}
h2{font-family:var(--font-display);font-weight:600;font-size:1.25rem;margin:0 0 8px;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:1.02rem;margin:0 0 6px;letter-spacing:.01em}
p{margin:0 0 10px}
.lede{max-width:68ch;font-size:1.02rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:.86em}
.small{font-size:.87rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:500;border:1px solid currentColor;white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.g-exact{color:var(--g-exact)} .g-logic{color:var(--g-logic)} .g-import{color:var(--g-import)} .g-compose{color:var(--g-compose)}
.g-definition{color:var(--g-def)} .g-interpretive{color:var(--g-interp)} .g-fail{color:var(--g-fail)} .g-witness{color:var(--g-exact)} .g-numeric{color:var(--g-num)}
.v-ok{color:var(--g-exact)} .v-inst{color:var(--g-logic)} .v-imp{color:var(--g-import)} .v-wps{color:var(--g-compose)} .v-num{color:var(--g-num)} .v-und{color:var(--g-interp)} .v-bad{color:var(--g-fail)}
.gen-badge{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;border:1px solid var(--g-interp);color:var(--g-interp);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.gen-note{border-left:4px solid var(--g-interp);padding:8px 12px;max-width:80ch}
/* method view */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 14px}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.84rem}
ol.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;counter-reset:s}
ol.steps li{counter-increment:s;border:1px solid var(--line);border-radius:8px;padding:10px 14px 10px 44px;position:relative;background:var(--panel)}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.85rem;display:grid;place-items:center}
ol.steps li b{display:block}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin-bottom:6px;max-width:75ch}
/* paper view */
.paper-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:1100px){.paper-grid{grid-template-columns:minmax(0,1fr)}}
.rail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:1100px){.rail{position:static;max-height:none}}
.cite{font-weight:500;max-width:80ch}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.87rem;margin-top:4px}
.claims{display:flex;flex-direction:column;gap:6px}
.claim{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 10px;cursor:pointer}
.claim:hover,.claim.sel{border-color:var(--accent);background:var(--accent-soft)}
.claim .cid{font-family:var(--font-mono);font-size:.82rem;color:var(--muted);padding-top:2px}
.claim .q{font-size:.8rem;color:var(--muted);margin-top:2px}
/* graph */
.graph{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 96px;padding:4px 8px 8px}
@media (max-width:760px){.graph{gap:0 44px}}
.col{display:flex;flex-direction:column;gap:9px;position:relative;z-index:2}
.col h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--font-body);font-weight:600;margin-bottom:2px}
.node{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--panel);border-radius:5px;padding:6px 8px;cursor:pointer;min-height:44px}
.node .nid{font-family:var(--font-mono);font-size:.76rem;color:var(--muted);display:block}
.node .nt{display:block;font-size:.84rem;line-height:1.3;font-weight:500;overflow-wrap:anywhere}
.node .ns{display:block;font-size:.72rem;color:var(--muted);margin-top:1px}
.node.st-new{border-left-color:var(--accent)}
.node.st-split{border-left-color:var(--accent);border-left-style:dashed}
.node.st-out-of-scope{border-style:dashed;border-left-style:dashed}
.node:hover,.node.sel{border-color:var(--accent);background:var(--accent-soft)}
.node.dim{opacity:.35}
svg.wires{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
svg.wires path.leg{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.4;pointer-events:stroke;cursor:pointer}
svg.wires path.leg.import{stroke-dasharray:5 4}
svg.wires path.leg.compose,svg.wires path.leg.interpretive{stroke-dasharray:1.5 4;stroke-linecap:round}
svg.wires path.leg.definition{stroke-dasharray:8 3 1.5 3}
svg.wires path.leg.hl{opacity:1;stroke-width:2.6}
svg.wires path.leg.lo{opacity:.08}
svg.wires .mk{fill:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--muted);align-items:center;margin-top:6px}
.legend .sw{display:inline-block;width:14px;height:10px;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend .sw.new{border-left-color:var(--accent)} .legend .sw.out{border-style:dashed}
/* route table */
tr.route{cursor:pointer}
tr.route:hover td,tr.route.sel td{background:var(--accent-soft)}
tr.route td:first-child{font-family:var(--font-mono);font-size:.82rem;white-space:nowrap}
td.rt{font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.status-FAILED{color:var(--g-fail);font-weight:600}
/* detail rail */
.rail h2{font-size:1.1rem}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 10px;font-size:.87rem;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.stmt{border-left:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft);border-radius:0 5px 5px 0;margin:8px 0;font-size:.92rem;overflow-wrap:anywhere}
.checks{list-style:none;margin:6px 0;padding:0;font-size:.84rem}
.checks li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}
.checks .ok{color:var(--g-exact);font-weight:600} .checks .no{color:var(--g-fail);font-weight:600}
.checks .grp{grid-template-columns:1fr;color:var(--muted);font-weight:600;border-bottom:none;padding-top:8px}
.checks li>.chip{justify-self:start}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font-family:var(--font-mono);font-size:.84rem;text-decoration:underline}
.finding{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-bottom:10px;max-width:80ch}
.finding .lvl{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.finding.premise,.finding.note{border-left-color:var(--g-import)}
.finding.structure{border-left-color:var(--accent)} .finding.derived{border-left-color:var(--g-compose)}
.op{font-family:var(--font-mono);font-size:.78rem;font-weight:500;color:var(--accent);white-space:nowrap}
.sig{width:auto;font-variant-numeric:tabular-nums}
.sig td,.sig th{text-align:center;padding:4px 12px}
.err{color:var(--g-fail);padding:20px}
@media (prefers-reduced-motion:no-preference){.node,.claim{transition:background .12s,border-color .12s}}
</style>
</head>
